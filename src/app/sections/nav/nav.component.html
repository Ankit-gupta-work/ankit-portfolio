<header class="nav" #navEl style="position: sticky; top: 0; z-index: 50">
  <div class="wrap" style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <a href="#top" aria-label="Ankit Gupta, back to top" style="display: flex; align-items: center; gap: 12px">
      <span style="width: 32px; height: 32px; border-radius: 8px; background: var(--elev); border: 1px solid var(--bh); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--accent)">AG</span>
      <span class="nav-name" style="font-size: 14px; font-weight: 400; color: var(--t1)">Ankit Gupta</span>
    </a>
    <nav class="navlinks" aria-label="Primary" style="display: flex; align-items: center; gap: 36px">
      @for (link of navLinks; track link.href) {
        <a class="nl" [href]="link.href">{{ link.label }}</a>
      }
    </nav>
    <div style="display: flex; align-items: center; gap: 12px">
      <button
        class="tgl"
        type="button"
        [attr.aria-label]="theme.theme() === 'light' ? 'Switch to dark theme' : 'Switch to light theme'"
        [title]="theme.theme() === 'light' ? 'Switch to dark theme' : 'Switch to light theme'"
        (click)="theme.toggle()"
      >
        <span class="ic-moon">
          <svg width="16" height="16" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1z" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round"></path></svg>
        </span>
        <span class="ic-sun">
          <svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3" style="fill: none; stroke: currentColor; stroke-width: 1.5"></circle><path d="M8 1.5v1.3M8 13.2v1.3M1.5 8h1.3M13.2 8h1.3M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round"></path></svg>
        </span>
      </button>
      <span class="status" tabindex="0">
        <span class="dot pulse"></span>
        <span class="s-long">Available Oct 2026</span><span class="s-short">Oct 2026</span>
        <span class="tip" role="tooltip">Full-time from October 2026</span>
      </span>
    </div>
  </div>
</header>
