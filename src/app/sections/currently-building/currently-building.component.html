<section id="building" style="position: relative; padding: 96px 0; scroll-margin-top: 40px">
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 40px; width: 900px; height: 420px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, var(--glow-c), transparent); pointer-events: none"></div>
  <div class="wrap" style="position: relative">
    <p class="eyebrow rv" appReveal style="margin-bottom: 20px">{{ data.eyebrow }}</p>

    <div class="build rv" appReveal style="display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 48px; align-items: stretch; padding: 40px; box-sizing: border-box; background: var(--surface); border: 1px solid var(--b); border-left: 2px solid var(--accent); border-radius: 16px">

      <div style="display: flex; flex-direction: column">
        <a href="#work" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; font-size: 44px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1">{{ data.name }}
          <svg width="22" height="22" aria-hidden="true"><path d="M5 17L17 5M7 5h10v10" style="fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"></path></svg>
        </a>
        <div style="margin: 24px 0; height: 1px; background: var(--b)"></div>
        <p style="margin: 0; max-width: 580px; font-size: 16px; line-height: 1.75; color: var(--t2)">{{ data.description }}</p>
        <div style="margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px">
          <a class="btn btn-p" [href]="links.jobpingLiveDemo">Live demo
            <svg class="ic" width="14" height="14" aria-hidden="true"><path d="M2.5 7h9M8 3.5L11.5 7L8 10.5" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"></path></svg>
          </a>
          <a class="btn btn-g" href="#think">Read the architecture
            <svg class="ic" width="14" height="14" aria-hidden="true"><path d="M2.5 7h9M8 3.5L11.5 7L8 10.5" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"></path></svg>
          </a>
        </div>
        <div style="margin-top: auto; padding-top: 32px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--t2)">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: #f59e0b"></span>
            <span>{{ data.status }}<span class="sep">·</span>{{ data.expected }}</span>
          </div>
          <div class="mono" style="display: flex; align-items: center; gap: 10px; font-size: 12px">
            <span class="dot pulse"></span>
            <span><span style="color: var(--t1)">Worker active</span><span class="sep">·</span>Last run: <span>{{ workerStatus.lastRun() }}</span><span class="sep">·</span>Next: <span>{{ workerStatus.nextRun() }}</span></span>
          </div>
        </div>
      </div>

      <app-terminal-log></app-terminal-log>

    </div>
  </div>
</section>
