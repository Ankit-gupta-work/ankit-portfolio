services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5080:8080"
    env_file:
      - ./server/.env
    environment:
      - REDIS_URL=redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
